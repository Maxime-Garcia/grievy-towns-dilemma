<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0a2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Grievy Town" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Grievy Town's Dilemma</title>
  <style>
    /* Neatpixels (ElvGames) — polices pixel LOCALES : plus aucune dépendance à
       Google Fonts (une requête réseau de moins, et le jeu reste jouable hors ligne
       via le service worker). Standard = corps de texte ; Boss/Blocks = titres et
       écrans de boss ; Minimal = HUD dense. Licence : public/assets/fonts/. */
    @font-face {
      font-family: 'Neatpixels';
      src: url('./assets/fonts/neatpixels-standard.ttf') format('truetype');
      font-display: block;
    }
    @font-face {
      font-family: 'Neatpixels Minimal';
      src: url('./assets/fonts/neatpixels-minimal.ttf') format('truetype');
      font-display: block;
    }
    @font-face {
      font-family: 'Neatpixels Boss';
      src: url('./assets/fonts/neatpixels-boss.ttf') format('truetype');
      font-display: block;
    }
    @font-face {
      font-family: 'Neatpixels Blocks';
      src: url('./assets/fonts/neatpixels-blocks.ttf') format('truetype');
      font-display: block;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      /* Prevent iOS bounce scroll */
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Neatpixels', monospace;
    }
    canvas {
      display: block;
      /* image-rendering: pixelated RETIRÉ — va de pair avec pixelArt:false dans
         main.ts. Le navigateur agrandit désormais le canvas en interpolant (lissé)
         au lieu de dupliquer les pixels (blocs durs). Pour revenir au rendu pixel :
         remettre `image-rendering: pixelated;` ici ET `pixelArt: true` dans main.ts. */
    }

    /* ── Boot loading overlay ────────────────────────────────────────────
       Visible from first paint (before the JS bundle / Phaser even boots) so
       there is never a plain black screen with zero feedback. BootScene and
       PreloaderScene report real Loader progress into this via the small
       bridge attached to window.__bootLoading below; the overlay is hidden
       once PreloaderScene finishes and MainMenuScene is about to start. */
    #boot-loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #000;
      color: #ffffff;
      transition: opacity 0.4s ease;
    }
    #boot-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #boot-loading .boot-title {
      font-size: 16px;
      text-align: center;
      padding: 0 20px;
    }
    #boot-loading .boot-bar-track {
      width: min(320px, 80vw);
      height: 20px;
      background: #222222;
      border: 2px solid #444444;
    }
    #boot-loading .boot-bar-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      transition: width 0.15s linear;
    }
    #boot-loading .boot-pct {
      font-size: 10px;
      color: #aaaaaa;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="boot-loading">
    <div class="boot-title">Grievy Town's Dilemma</div>
    <div class="boot-bar-track"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
    <div class="boot-pct" id="boot-pct">0%</div>
  </div>
  <script>
    // Tiny bridge so Phaser scenes (loaded later as a module) can report real
    // Loader progress into this static HTML overlay without any bundler wiring.
    window.__bootLoading = {
      setProgress(pct, label) {
        const fill = document.getElementById('boot-bar-fill');
        const pctEl = document.getElementById('boot-pct');
        if (fill) fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
        if (pctEl) pctEl.textContent = (label ? label + ' — ' : '') + Math.round(pct) + '%';
      },
      hide() {
        const overlay = document.getElementById('boot-loading');
        if (overlay) {
          overlay.classList.add('hidden');
          setTimeout(() => overlay.remove(), 500);
        }
      },
    };
  </script>
  <script type="module" src="/src/main.ts"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
